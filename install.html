<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Instalar ChatPro</title>
<script src="https://api.bitrix24.com/api/v1/"></script>
<style>
  body { font:14px/1.6 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         padding:24px; color:#222; }
  h1 { font-size:17px; margin:0 0 16px; }
  li { margin:4px 0; }
  .ok { color:#0e8a7d; } .erro { color:#c0392b; }
  #fim { margin-top:18px; font-weight:600; }
</style>
</head>
<body>

<h1>Instalando o botao do ChatPro...</h1>
<ul id="log"></ul>
<div id="fim"></div>

<script>
(function () {
  var base = location.href.split('?')[0].replace(/\/[^\/]*$/, '');
  var handler = base + '/botao.html';

  // Onde o botao deve aparecer. Se algum codigo nao existir no seu
  // Bitrix24, ele simplesmente falha e os outros continuam.
  var locais = [
    { code: 'CRM_DEAL_DETAIL_TOOLBAR',    nome: 'Barra do negocio' },
    { code: 'CRM_LEAD_DETAIL_TOOLBAR',    nome: 'Barra do lead' },
    { code: 'CRM_CONTACT_DETAIL_TOOLBAR', nome: 'Barra do contato' },
    { code: 'CRM_COMPANY_DETAIL_TOOLBAR', nome: 'Barra da empresa' }
  ];

  var log = document.getElementById('log');
  function linha(txt, classe) {
    var li = document.createElement('li');
    li.textContent = txt;
    li.className = classe || '';
    log.appendChild(li);
  }

  function bind(i) {
    if (i >= locais.length) {
      document.getElementById('fim').textContent =
        'Pronto. Abra um negocio para ver o botao.';
      try { BX24.installFinish(); } catch (e) {}
      return;
    }
    var l = locais[i];
    BX24.callMethod('placement.bind', {
      PLACEMENT: l.code,
      HANDLER:   handler,
      TITLE:     'ChatPro'
    }, function (res) {
      if (res.error()) {
        linha(l.nome + ' — ' + res.error_description(), 'erro');
      } else {
        linha(l.nome + ' — instalado', 'ok');
      }
      bind(i + 1);
    });
  }

  BX24.init(function () { bind(0); });
})();
</script>

</body>
</html>
